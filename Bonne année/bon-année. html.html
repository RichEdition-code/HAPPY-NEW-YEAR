<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonne Année 2026 !</title>
    <style>
        .nom { color: orange; }

        body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0f0c29, #3a0e44, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            position: relative;
        }

        /* IMAGE D'ARRIÈRE-PLAN */
        body::before {
            content: "";
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('photo.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.8; 
            z-index: -1;
        }

        /* ÉCRAN DE DÉMARRAGE */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0c29;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 1s ease, visibility 1s;
        }

        #start-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            color: white;
            background: linear-gradient(45deg, #ff8c00, #ff4500);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
            /* Animation de secousse et rotation toutes les 3s */
            animation: shake-rotate 3s infinite;
        }

        @keyframes shake-rotate {
            0%, 80%, 100% { transform: translate(0, 0) rotate(0deg); }
            82% { transform: translate(-5px, 2px) rotate(-3deg); }
            84% { transform: translate(5px, -2px) rotate(3deg); }
            86% { transform: translate(-5px, -2px) rotate(-3deg); }
            88% { transform: translate(5px, 2px) rotate(3deg); }
            90% { transform: translate(-5px, 1px) rotate(-2deg); }
            92% { transform: translate(5px, -1px) rotate(2deg); }
        }

        /* CONTENU PRINCIPAL */
        .greeting-container {
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
            opacity: 0;
            transform: scale(0.8);
            transition: all 1.2s ease-out;
            visibility: hidden;
        }

        .greeting-container.visible-now {
            opacity: 1;
            transform: scale(1);
            visibility: visible;
        }

        h1#newYearMessage {
            font-size: 3.5em;
            margin-bottom: 2px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #annee { font-weight: bold; font-size: 70px; color: #FFD700; }

        .vœux-style { font-size: 2rem; font-weight: 300; margin-top: 10px; }
        #mot-changeant { font-weight: bold; color: #FFD700; display: inline-block; transition: all 0.5s ease; }

        /* CONFETTIS */
        .confetti-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 50%;
            z-index: 20;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { opacity: 0; transform: translateY(-50px) rotate(0deg); }
            10% { opacity: 1; }
            100% { opacity: 0; transform: translateY(105vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <button id="start-btn">Ouvrir mes vœux 🎁</button>
    </div>

    <div class="greeting-container" id="main-content">
        <h1 class="nom"><strong>KARIM SANOU</strong></h1>
        <span>vous souhaite</span>
        <h1 id="newYearMessage">Bonne Année <span id="annee">2026 !</span></h1>
        
        <div id="subMessage">
            <p style="font-size: 1.5em; font-style: italic; margin-bottom: 0;">Que cette année vous apporte</p>
            <p class="vœux-style"><span id="mot-changeant">Bonheur</span> !</p>
        </div>
    </div>

    <div class="confetti-container"></div>

    <script>
        const vœux = ["du Succès", "du Bonheur", "de la Santé", "de l'Amour", "de la Prospérité", "de la Sérénité"];
        const spanMot = document.getElementById('mot-changeant');
        const startBtn = document.getElementById('start-btn');
        const introScreen = document.getElementById('intro-screen');
        const mainContent = document.getElementById('main-content');
        const confettiContainer = document.querySelector('.confetti-container');

        // FONCTION CHANGER LE TEXTE
        function updateText() {
            spanMot.style.opacity = "0";
            spanMot.style.transform = "translateY(10px)";
            setTimeout(() => {
                const nouveauVœu = vœux[Math.floor(Math.random() * vœux.length)];
                spanMot.textContent = nouveauVœu;
                spanMot.style.opacity = "1";
                spanMot.style.transform = "translateY(0)";
            }, 500);
        }

        // FONCTION CRÉER CONFETTIS
        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 8 + 5 + 'px';
            confetti.style.width = size;
            confetti.style.height = size;
            
            const colors = ['#f0f', '#0ff', '#ff0', '#fff', '#FFD700', '#f8f'];
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            const duration = Math.random() * 3 + 2;
            confetti.style.animationDuration = duration + 's';
            
            confettiContainer.appendChild(confetti);
            setTimeout(() => confetti.remove(), duration * 1000);
        }

        // ÉVÉNEMENT CLIC
        startBtn.addEventListener('click', () => {
            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.visibility = 'hidden';
                mainContent.classList.add('visible-now');
                
                // Lancer les animations seulement après le clic
                setInterval(createConfetti, 100);
                setInterval(updateText, 3000);
            }, 1000);
        });
    </script>
</body>
</html>
